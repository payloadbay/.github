name: Repository Module Bootstrap

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name in the Payload Bay organization
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: payloadbay-module-bootstrap-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap repository modules
    if: ${{ vars.PAYLOADBAY_BASELINE_APP_ID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: baseline
          persist-credentials: false

      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v3.2.0
        with:
          app-id: ${{ vars.PAYLOADBAY_BASELINE_APP_ID }}
          private-key: ${{ secrets.PAYLOADBAY_BASELINE_APP_PRIVATE_KEY }}
          owner: payloadbay

      - name: Check out target repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: payloadbay/${{ inputs.repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Apply the declared module contract
        run: node baseline/.github/scripts/module-bootstrap.mjs --repository-root target

      - name: Regenerate Bun lockfile without lifecycle scripts
        working-directory: target
        run: bun install --lockfile-only --ignore-scripts

      - name: Create or update setup pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          branch="chore/apply-repository-modules"
          repository="payloadbay/${REPOSITORY}"

          git -C target switch -C "$branch"
          git -C target add -A

          if git -C target diff --cached --quiet; then
            echo "The declared repository modules are already current."
            exit 0
          fi

          git -C target config user.name "payload-bay-repository-baseline[bot]"
          git -C target config user.email "4383086+payload-bay-repository-baseline[bot]@users.noreply.github.com"
          git -C target commit -m "chore: apply repository modules"
          git -C target remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${repository}.git"
          git -C target push --force-with-lease origin "$branch"

          existing=$(gh pr list --repo "$repository" --head "payloadbay:$branch" --base master --state open --json number --jq '.[0].number')
          if [[ -z "$existing" ]]; then
            gh pr create --repo "$repository" --draft --base master --head "$branch" \
              --title "chore: apply repository modules" \
              --body "Applies the repository-owned Payload Bay module declaration, including its package contract, managed configuration files, and regenerated bun.lock."
            existing=$(gh pr list --repo "$repository" --head "payloadbay:$branch" --base master --state open --json number --jq '.[0].number')
          fi

          gh pr edit "$existing" --repo "$repository" \
            --add-label maintenance \
            --add-label area:infrastructure \
            --add-label quality:exempt
