name: Repository Baseline

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/commitlint.config.mjs"
      - ".github/labeler.yml"
      - ".github/labels.json"
      - ".github/repository-baseline.json"
      - ".github/repository-baseline.schema.json"
      - ".github/scripts/repository-baseline.mjs"
      - ".github/scripts/repository-baseline.test.mjs"
      - ".github/scripts/test-speckit.py"
      - ".github/speckit/**"
      - ".github/tooling/**"
      - ".github/scripts/tooling.test.mjs"
      - ".github/workflows/metadata-labeler.yml"
      - ".github/workflows/planned-work-guard.yml"
      - ".github/workflows/commitlint.yml"
      - ".github/workflows/pr-quality.yml"
      - ".github/workflows/repository-baseline.yml"
      - "renovate-config.json"
  push:
    branches:
      - master
    paths:
      - "AGENTS.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - ".github/commitlint.config.mjs"
      - ".github/labeler.yml"
      - ".github/labels.json"
      - ".github/repository-baseline.json"
      - ".github/repository-baseline.schema.json"
      - ".github/scripts/repository-baseline.mjs"
      - ".github/scripts/repository-baseline.test.mjs"
      - ".github/scripts/test-speckit.py"
      - ".github/speckit/**"
      - ".github/tooling/**"
      - ".github/scripts/tooling.test.mjs"
      - ".github/workflows/metadata-labeler.yml"
      - ".github/workflows/planned-work-guard.yml"
      - ".github/workflows/commitlint.yml"
      - ".github/workflows/pr-quality.yml"
      - ".github/workflows/repository-baseline.yml"
      - "renovate-config.json"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional repository name; leave empty to inspect every repository
        required: false
        type: string
      dry_run:
        description: Report drift without changing repositories
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: payloadbay-repository-baseline
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Check out baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate JSON
        run: |
          node -e 'for (const path of process.argv.slice(1)) JSON.parse(require("node:fs").readFileSync(path, "utf8"))' \
            .github/labels.json \
            .github/repository-baseline.json \
            .github/repository-baseline.schema.json \
            renovate-config.json

      - name: Test baseline synchronizer
        run: node --test .github/scripts/repository-baseline.test.mjs

      - name: Validate shared formatting presets
        env:
          PAYLOADBAY_TOOLING_MODULES: ${{ runner.temp }}/payloadbay-tooling/package.json
        run: |
          npm install --prefix "$RUNNER_TEMP/payloadbay-tooling" --ignore-scripts --no-package-lock \
            eslint@9.39.5 @typescript-eslint/parser@8.71.2 typescript@5.9.3 prettier@3.9.9
          node --test .github/scripts/tooling.test.mjs

      - name: Install pinned SpecKit for preset validation
        run: |
          python3 -m venv "$RUNNER_TEMP/speckit-validation"
          "$RUNNER_TEMP/speckit-validation/bin/python" -m pip install \
            "specify-cli==$(python3 -c 'import json; print(json.load(open(".github/speckit/setup.json"))["specifyVersion"])')" \
            "PyYAML==$(python3 -c 'import json; print(json.load(open(".github/speckit/setup.json"))["pythonDependencies"]["PyYAML"])')"

      - name: Validate preset installation and Python integrations
        env:
          SPECIFY_EXECUTABLE: ${{ runner.temp }}/speckit-validation/bin/specify
        run: '"$RUNNER_TEMP/speckit-validation/bin/python" .github/scripts/test-speckit.py'

  synchronize:
    name: Synchronize Repositories
    needs: validate
    if: ${{ github.event_name != 'pull_request' && vars.PAYLOADBAY_BASELINE_APP_ID != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v3.2.0
        with:
          app-id: ${{ vars.PAYLOADBAY_BASELINE_APP_ID }}
          private-key: ${{ secrets.PAYLOADBAY_BASELINE_APP_PRIVATE_KEY }}
          owner: payloadbay

      - name: Synchronize repository baseline
        env:
          BASELINE_APP_ID: ${{ vars.PAYLOADBAY_BASELINE_APP_ID }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          arguments=()
          if [[ -n "$REQUESTED_REPOSITORY" ]]; then
            arguments+=(--repository "$REQUESTED_REPOSITORY")
          fi
          if [[ "$REQUESTED_DRY_RUN" == "true" ]]; then
            arguments+=(--dry-run)
          fi
          node .github/scripts/repository-baseline.mjs "${arguments[@]}"
